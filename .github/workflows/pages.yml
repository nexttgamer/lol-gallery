name: Deploy Pages

# Actions-based Pages deploy — replaces the legacy Jekyll build that
# intermittently failed ("Page build failed.") on this ~11k-file repo.
# Every push to main deploys the repo root as-is.
#
# 2026-09-29: in-flight deploys are no longer cancelled. The upload workers
# push every few minutes and a deploy takes several, so cancel-in-progress
# let a busy hour cancel every run before it finished. GitHub now keeps one
# deploy running plus only the NEWEST pending one: bursts still collapse,
# and every deploy that starts also finishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages rejects a site over 10 GB ("Artifact could not be deployed").
      # At 11.7 GB that froze the site from 2026-09-17 to 09-29 and every new
      # gallery link 404'd. Fail fast with a clear reason instead; the box's
      # scripts/gallery-prune.mjs (6-hourly self-heal) keeps the site small.
      - name: Check site size
        run: |
          bytes=$(du -sb --exclude=.git --exclude=.github . | cut -f1)
          echo "Site size: $((bytes / 1048576)) MiB"
          if [ "$bytes" -gt 9000000000 ]; then
            echo "::error::Site is $((bytes / 1048576)) MiB; GitHub Pages rejects deploys over 10 GB. Run scripts/gallery-prune.mjs on the box."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
