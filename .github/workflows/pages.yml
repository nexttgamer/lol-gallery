name: Deploy Pages

# Actions-based Pages deploy — replaces the legacy Jekyll build that
# intermittently failed ("Page build failed.") on this ~11k-file repo.
# Every push to main deploys the repo root as-is; bursts collapse via
# the concurrency group (only the newest deploy survives).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
